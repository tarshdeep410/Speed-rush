<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SPEED//RUSH 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b2a;color:white;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94vw,700px);display:flex;gap:8px;z-index:2;pointer-events:none}.card,.meter{background:#081426d9;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px;text-align:center;flex:1;backdrop-filter:blur(8px)}.label{font-size:10px;letter-spacing:2px;color:#a9c7dd;font-weight:bold}.value{font-size:clamp(20px,4vw,30px);font-weight:900;font-variant-numeric:tabular-nums}#clock{color:#58f5ff}#distance{color:#c7ff62}
#status{position:fixed;z-index:2;top:28%;left:50%;transform:translate(-50%,-50%);font-size:clamp(30px,7vw,66px);font-weight:1000;letter-spacing:3px;text-shadow:0 4px 20px #000;text-align:center;pointer-events:none}#sub{font-size:12px;letter-spacing:2px}
.bottom{position:fixed;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);width:min(94vw,700px);display:grid;grid-template-columns:1fr 1fr;gap:8px}.meter{grid-column:1/-1;text-align:left;padding:8px 12px}.meterhead{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;margin-bottom:5px}.bar{height:8px;background:#ffffff24;border-radius:9px;overflow:hidden}#stamina{height:100%;width:100%;background:linear-gradient(90deg,#54f88b,#d4ff67)}.tap{height:70px;border-radius:15px;border:1px solid #ffffff4a;background:#101f35ed;color:white;font-size:12px;font-weight:900;letter-spacing:2px;touch-action:none}.tap b{display:block;font-size:23px;color:#58f5ff}.tap.active{border-color:#58f5ff;background:#16435a}
#overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#02091675}#panel{width:min(88vw,390px);padding:24px;border:1px solid #ffffff4a;border-radius:20px;background:#071326f2;text-align:center;box-shadow:0 20px 70px #0009}h1{margin:0 0 10px;font-size:28px;letter-spacing:2px}p{color:#c6d8e8;font-size:14px;line-height:1.5}#start{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#58eaf7,#c7ff62);font-weight:1000;letter-spacing:2px}
</style></head><body><div id="game"></div>
<div class="hud"><div class="card"><div class="label">TIME</div><div id="clock" class="value">0.00</div></div><div class="card"><div class="label">DISTANCE</div><div id="distance" class="value">0 m</div></div><div class="card"><div class="label">SPEED</div><div id="speed" class="value">0.0</div></div></div>
<div id="status">READY<div id="sub">ALTERNATE LEFT / RIGHT</div></div>
<div class="bottom"><div class="meter"><div class="meterhead"><b>STAMINA</b><b id="stamtext">100%</b></div><div class="bar"><div id="stamina"></div></div></div><button id="left" class="tap"><b>◀</b>LEFT TAP</button><button id="right" class="tap"><b>▶</b>RIGHT TAP</button></div>
<div id="overlay"><div id="panel"><h1>SPEED<span style="color:#58f5ff">//</span>RUSH</h1><p>Run 100 metres in a 3D stadium. Tap left and right alternately to build speed. Keep a steady rhythm to save stamina.</p><button id="start">ENTER STADIUM</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),root=$('game');if(!window.THREE){$('panel').innerHTML='<h1>3D ENGINE NOT LOADED</h1><p>Check your internet connection and refresh.</p>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91b8d5);scene.fog=new THREE.Fog(0x91b8d5,100,300);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe2f3ff,0x34422d,2));const sun=new THREE.DirectionalLight(0xfff0d7,3);sun.position.set(-30,55,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function box(parent,x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x4c674d));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);
const track=mat(0xb9433d),line=mat(0xf3e8d2),green=mat(0x328044),concrete=mat(0x637387),dark=mat(0x253244);
const straight=40,R=24,pts=[];function p(x,z){pts.push(new THREE.Vector3(x,0,z))}
for(let i=0;i<=50;i++)p(-straight+2*straight*i/50,-R);
for(let i=1;i<=50;i++){let a=-Math.PI/2+Math.PI*i/50;p(straight+R*Math.cos(a),R*Math.sin(a))}
for(let i=1;i<=50;i++)p(straight-2*straight*i/50,R);
for(let i=1;i<=50;i++){let a=Math.PI/2+Math.PI*i/50;p(-straight+R*Math.cos(a),R*Math.sin(a))}
const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal'),samples=curve.getSpacedPoints(600),N=samples.length-1;
function strip(a,b,y,m){let v=[],idx=[];for(let i=0;i<=N;i++){let q=samples[i],pr=samples[(i-1+N)%N],nx=samples[(i+1)%N],dx=nx.x-pr.x,dz=nx.z-pr.z,l=Math.hypot(dx,dz)||1,ox=-dz/l,oz=dx/l;v.push(q.x+ox*a,y,q.z+oz*a,q.x+ox*b,y,q.z+oz*b)}for(let i=0;i<N;i++){let j=i*2;idx.push(j,j+2,j+1,j+1,j+2,j+3)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();let mesh=new THREE.Mesh(g,m);mesh.receiveShadow=true;scene.add(mesh)}
strip(-5,5,.03,track);for(let i=0;i<=8;i++){let o=-5+i*1.25;strip(o-.025,o+.025,.05,line)}
// Stadium infield oval
const shape=new THREE.Shape();shape.absellipse(0,0,straight+R-6,R-6,0,Math.PI*2,false,0);const fg=new THREE.Mesh(new THREE.ShapeGeometry(shape,100),green);fg.rotation.x=-Math.PI/2;fg.position.y=.04;scene.add(fg);
for(let i=0;i<7;i++)box(scene,-18+i*6,.07,0,2.8,.03,13,mat(i%2?0x39894a:0x2d7840));
const colors=[0x245d9a,0xf0f1ef,0xf1a92c,0xe34c55,0x2cc3b2,0x283448,0x9cc8f4];
function person(x,y,z,c){const g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.34,3,5),mat(c));body.position.y=.28;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.1,7,6),mat(0xd5a27e));head.position.y=.55;g.add(head);g.position.set(x,y,z);scene.add(g)}
for(const s of [-1,1]){for(let tier=0;tier<5;tier++){let z=s*(R+11+tier*2),y=1+tier*1.1;box(scene,0,y,z,116,.7,3, tier%2?concrete:dark);for(let j=0;j<90;j++){let x=-55+j*110/89;person(x,y+.35,z+(Math.random()-.5)*2,colors[Math.floor(Math.random()*colors.length)])}}box(scene,0,8.5,s*(R+15),120,.7,4,concrete);box(scene,0,7.8,s*(R+15),118,.18,.3,mat(0x42cddd));for(let x=-55;x<56;x+=17)box(scene,x,5.2,s*(R+14),.35,7,.35,dark)}
for(const s of [-1,1])for(let tier=0;tier<4;tier++)for(let i=0;i<36;i++){let a=-Math.PI/2+Math.PI*i/35,rr=R+10+tier*2,x=s*(straight+rr*Math.cos(a)),z=rr*Math.sin(a);box(scene,x,1+tier,z,2.4,.6,2, tier%2?concrete:mat(0x315b7c));if(i%2===0)person(x,1.35+tier,z,colors[(i+tier)%colors.length])}
for(let x of [-55,-18,18,55])for(let s of [-1,1]){let z=s*(R+20);box(scene,x,10,z,.35,20,.35,dark);box(scene,x,20,z,3,.25,1,mat(0xf5fbff));let l=new THREE.PointLight(0xe4f5ff,10,55);l.position.set(x,19,z);scene.add(l)}
// runner
const runner=new THREE.Group();scene.add(runner);const skin=mat(0x98694d),kit=mat(0x13c7db),shorts=mat(0x172945),shoe=mat(0xf4f5ed),hair=mat(0x19191d);
box(runner,0,1.3,0,.55,.75,.3,kit);box(runner,0,.82,0,.5,.22,.3,shorts);
function ball(r,x,y,z,m){let o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),m);o.position.set(x,y,z);o.castShadow=true;runner.add(o);return o}ball(.21,0,1.88,0,skin);ball(.215,0,1.98,-.02,hair);
function leg(x,z,m){let pivot=new THREE.Group();pivot.position.set(x,.76,z);runner.add(pivot);let upper=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.36,3,7),m);upper.position.y=-.22;upper.castShadow=true;pivot.add(upper);let knee=new THREE.Group();knee.position.y=-.43;pivot.add(knee);let lower=new THREE.Mesh(new THREE.CapsuleGeometry(.07,.34,3,7),skin);lower.position.y=-.2;lower.castShadow=true;knee.add(lower);box(pivot,x>0?.02:-.02,-.68,.13,.2,.1,.32,shoe);return {pivot,knee}}
function arm(x){let p=new THREE.Group();p.position.set(x*.3,1.55,0);runner.add(p);let a=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.38,3,7),skin);a.position.set(x*.22,-.22,0);p.add(a);return p}
const legs=[leg(-.15,0,shorts),leg(.15,0,shorts)],arms=[arm(-1),arm(1)];
let distance=0,speed=0,stamina=100,elapsed=0,started=false,finished=false,last='right',lastTime=0,anim=0,prev=performance.now();
function posAt(d){return curve.getPointAt((d/curve.getLength())%1)}function orient(d){let t=(d/curve.getLength())%1,p=curve.getPointAt(t),v=curve.getTangentAt(t);runner.position.set(p.x,.07,p.z);runner.rotation.y=Math.atan2(v.x,v.z)}
function status(a,b=''){$('status').innerHTML=a+(b?'<div id="sub">'+b+'</div>':'')}
function begin(){$('overlay').style.display='none';distance=0;speed=0;stamina=100;elapsed=0;started=true;finished=false;last='right';lastTime=0;status('READY','GET SET');setTimeout(()=>{if(started)status('SET')},700);setTimeout(()=>{if(started)status('GO!','ALTERNATE LEFT / RIGHT')},1400);setTimeout(()=>{if(started)status('')},2200)}
$('start').onclick=begin;
function tap(side){if(!started||finished)return;let now=performance.now();if(side===last){speed=Math.max(0,speed-1);stamina=Math.max(0,stamina-3);status('ALTERNATE!','LEFT THEN RIGHT');setTimeout(()=>{if(started)status('')},450);return}let gap=lastTime?now-lastTime:350,good=gap>180&&gap<520;speed=Math.min(8.5,speed+(good?1:.45));stamina=Math.max(0,stamina-(good?.45:1.3));last=side;lastTime=now;$ (side).classList.add('active');setTimeout(()=>$(side).classList.remove('active'),90)}
$('left').addEventListener('pointerdown',e=>{e.preventDefault();tap('left')});$('right').addEventListener('pointerdown',e=>{e.preventDefault();tap('right')});renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientY>innerHeight*.68)return;tap(e.clientX<innerWidth/2?'left':'right')});
function endRace(){finished=true;started=false;status('FINISH!',elapsed.toFixed(2)+' SECONDS');$('overlay').style.display='grid';$('panel').innerHTML='<h1>RACE COMPLETE</h1><p>Your 100 metre time: <strong>'+elapsed.toFixed(2)+' seconds</strong></p><button id="start">RACE AGAIN</button>';$('start').onclick=begin}
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-prev)/1000,.04);prev=now;anim+=dt;if(started){elapsed+=dt;distance+=speed*dt*.95;stamina=Math.max(0,stamina-(speed>5?.22:.06)*dt);speed=Math.max(0,speed-(stamina<20?.85:.32)*dt);if(distance>=100){distance=100;endRace()}}
orient(distance*.9);let run=started?Math.min(speed/6,1):0,stride=anim*(5+speed*1.7);legs[0].pivot.rotation.x=Math.sin(stride)*.7*run;legs[1].pivot.rotation.x=-Math.sin(stride)*.7*run;legs[0].knee.rotation.x=Math.max(0,-Math.sin(stride+.7))*.8*run;legs[1].knee.rotation.x=Math.max(0,Math.sin(stride+.7))*.8*run;arms[0].rotation.x=-Math.sin(stride)*.6*run;arms[1].rotation.x=Math.sin(stride)*.6*run;runner.position.y=.07+Math.abs(Math.sin(stride*2))*.07*run;
let a=runner.rotation.y,desired=new THREE.Vector3(runner.position.x-Math.sin(a)*7,3.2,runner.position.z-Math.cos(a)*7);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(runner.position.x+Math.sin(a)*7,1.6,runner.position.z+Math.cos(a)*7);
$('clock').textContent=elapsed.toFixed(2);$('distance').textContent=Math.floor(distance)+' m';$('speed').textContent=(speed*1.3).toFixed(1);$('stamina').style.width=stamina+'%';$('stamtext').textContent=Math.round(stamina)+'%';renderer.render(scene,camera)}
orient(0);camera.position.set(0,4,-12);camera.lookAt(0,1,0);requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
})();
</script></body></html>
